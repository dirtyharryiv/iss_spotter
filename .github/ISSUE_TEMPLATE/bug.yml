---
name: Bug report
description: Report something that is not working in ISS Spotter
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please search existing issues first and update to the latest ISS Spotter release if possible.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing open and closed issues for the same problem.
          required: true
        - label: This report is about one specific problem.
          required: true
        - label: I restarted Home Assistant after installing or updating the integration.
          required: true

  - type: input
    id: integration_version
    attributes:
      label: ISS Spotter version
      description: You can find this in HACS or in `custom_components/iss_spotter/manifest.json`.
      placeholder: "2.4.0"
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.6.0"
    validations:
      required: true

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual copy
        - Other
    validations:
      required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Setup or config flow
        - Main ISS sighting sensor
        - ISS position attributes or map card
        - SpaceDevs astronaut sensor
        - Icon or branding
        - Other or not sure
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Share the relevant settings. Approximate location is fine; do not post exact home coordinates if you do not want to.
      value: |
        - Location source: Home Assistant location / manual coordinates
        - Approximate location or region:
        - Minimum elevation:
        - Sun elevation limit:
        - Minimum visibility in minutes:
        - Days in the future:
        - SpaceDevs astronaut list enabled: yes/no
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the visible symptom. For example, `unknown` state, missing entity, wrong pass duration, missing icon, or an error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that triggers the problem.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: sensor_state
    attributes:
      label: Sensor state and attributes
      description: If a sensor exists, copy the state and relevant attributes from Developer Tools > States.
      render: yaml
    validations:
      required: false

  - type: textarea
    id: comparison
    attributes:
      label: Comparison source
      description: For missing or incorrect sightings, add the expected pass time/elevation and the source you compared against, such as Heavens Above or Astroviewer.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Debug logs
      description: Enable debug logging for `custom_components.iss_spotter`, reproduce the issue, then paste the relevant log lines. If there are no relevant logs, write that here.
      render: text
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag screenshots here if the problem is visible in the UI.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add anything else that may help understand the problem.
    validations:
      required: false
