---
name: Feature request
description: Suggest an improvement for ISS Spotter
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please search existing issues first so related ideas can be discussed in one place.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing open and closed issues for similar requests.
          required: true
        - label: This request is about one specific improvement.
          required: true

  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Main ISS sighting sensor
        - ISS position attributes or map card
        - SpaceDevs astronaut sensor
        - Setup or configuration
        - Documentation or examples
        - Other or not sure
    validations:
      required: true

  - type: dropdown
    id: change_type
    attributes:
      label: Type of change
      options:
        - New sensor or entity
        - New or changed sensor attribute
        - New configuration option
        - Data source or calculation change
        - Documentation or example
        - Other
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Describe what you want to do in Home Assistant that is currently hard or impossible.
      placeholder: "I want to..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the behavior, entity, attribute, option, or documentation change you would like to see.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example output or data source
      description: If relevant, add sample sensor attributes, automation YAML, screenshots, links to source data, or comparison services.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Mention any current workaround or alternative you have tried.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add anything else that may help evaluate the request.
    validations:
      required: false
